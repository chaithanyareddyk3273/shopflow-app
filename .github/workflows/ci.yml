# CI/CD for the three microservices.
#
#   test ──▶ build + Trivy scan ──▶ push to GHCR ──▶ update shopflow-gitops (dev)
#   (every push/PR)   (every push/PR)   (main only)        (main only) → ArgoCD deploys dev
#
# Pull requests run test + build + scan, so nothing broken or vulnerable gets merged.
# Only main publishes images and deploys.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running pipeline
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Images are published as ghcr.io/<owner>/shopflow-<service>
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/shopflow
  GITOPS_REPO: ${{ github.repository_owner }}/shopflow-gitops

jobs:
  # ── 1. Lint + unit tests, one parallel job per service ────────────────────────
  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [orders-api, inventory-svc, notifier]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest)
        run: pytest -v

  # ── 2. Build the image, scan it, and (on main) publish it ─────────────────────
  build:
    name: Build & scan (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GitHub Container Registry
    strategy:
      fail-fast: false
      matrix:
        service: [orders-api, inventory-svc, notifier]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Tags: sha-<7 chars> (immutable, what gets deployed) and "main" (moving pointer)
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Fail the pipeline on HIGH/CRITICAL vulnerabilities that already have a fix:
      # a vulnerable image is never published or deployed.
      # Pinned to a commit SHA (not a tag): tags can be moved to different code,
      # a commit can't. Important for a third-party action that runs in the pipeline.
      - name: Security scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ steps.meta.outputs.version }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same build again with push enabled; every layer comes from the cache, so it's fast
      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}

  # ── 3. Deploy to dev: write the new tags into shopflow-gitops ─────────────────
  # CI never talks to the cluster. It changes Git; ArgoCD sees the commit and deploys.
  deploy-dev:
    name: Deploy to dev (GitOps)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out shopflow-gitops
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          # Fine-grained token with write access to shopflow-gitops only (see README)
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Install yq
        run: sudo curl -sSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 && sudo chmod +x /usr/local/bin/yq

      - name: Set the new image tag for every service in dev
        run: |
          tag="sha-${GITHUB_SHA::7}"
          for svc in orders-api inventory-svc notifier; do
            yq -i ".services.\"$svc\".image.tag = \"$tag\"" environments/dev/values.yaml
          done
          git diff

      - name: Commit and push
        run: |
          git config user.name "shopflow-ci"
          git config user.email "shopflow-ci@users.noreply.github.com"
          git add environments/dev/values.yaml
          git commit -m "dev: deploy shopflow-app@${GITHUB_SHA::7}" \
                     -m "Triggered by ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          git push
